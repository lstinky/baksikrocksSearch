# suppress inspection "UnusedProperty" for whole file

Cdlc.findAllEasy =select * \
  from \
    cdlc \
  where \
    (upper(concat(artist,' - ',title)) like upper('%:value%')) \
    and (parts like '%bass%') \
    and (platforms like '%pc%') \
  order by artist, title ASC \
  Limit 100;

Cdlc.findAllHalf =select * \
  from \
    cdlc \
  where \
    (parts like '%bass%') \
    and (platforms like '%pc%') \
    and (upper(concat(artist,' ',title)) like (concat('%',upper(:left_path),'%')) \
        or upper(concat(artist,' ',title)) like (concat('%',upper(:left_path),'%')) \
        or upper(concat(artist,' ',title)) like (concat('%',upper(:right_path),'%'))) \
  order by artist, title ASC \
  Limit 100;

Cdlc.findAllByArtist =SELECT * \
  FROM \
    cdlc \
  where \
    upper(artist) like (concat('%',upper(:artist),'%')) \
    and (parts like '%bass%') \
    and (platforms like '%pc%') \
  order by artist, title ASC \
  Limit 100;

Cdlc.findAllByTitle =SELECT * \
  FROM \
    cdlc \
  where \
    upper(title) like (concat('%',upper(:title),'%')) \
    and (parts like '%bass%') \
    and (platforms like '%pc%') \
    and title NOT IN ( SELECT title FROM cdlc where artist like '%:title%' ) \
  order by artist, title ASC \
  Limit 100;